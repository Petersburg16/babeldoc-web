<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- 1. LibreOffice 原 fc_local.conf 内容（保留） -->
  <match target="pattern"><test name="family"><string>Symbol</string></test><edit name="family" mode="append" binding="same"><string>OpenSymbol</string></edit></match>
  <alias binding="same"><family>Liberation Sans Narrow</family><default><family>Arial Narrow</family></default></alias>
  <alias binding="same"><family>Arial Narrow</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <!-- 2. 中文 Windows/方正/华文 字体名 -> 服务器自带开源字体 -->
