  <!-- 3. 标题宋（小标宋/中宋）-> 思源宋体 Bold -->
  <match target="pattern"><test name="family"><string>方正小标宋简体</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>方正小标宋_GBK</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>FZXiaoBiaoSong-B05</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>FZXiaoBiaoSong-B05S</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>华文中宋</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>STZhongsong</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>方正大标宋简体</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>FZDaBiaoSong-B06S</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>方正粗宋简体</string></test><edit name="family" mode="prepend" binding="strong"><string>Source Han Serif CN</string></edit><edit name="weight" mode="assign" binding="strong"><const>bold</const></edit></match>
  <!-- 4. 通用族兜底：拉丁优先 Liberation，中文缺字回落思源 -->
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Source Han Serif CN</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family><family>Source Han Sans CN</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family><family>Source Han Sans CN</family></prefer></alias>
