[project]
name = "babeldoc-web"
version = "0.1.0"
description = "BabelDOC 多用户 Web 服务：账号、任务队列、进度推送与管理后台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "cryptography>=44",
    "pypdf>=5",
    "httpx[socks]>=0.28",
    "psutil>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
